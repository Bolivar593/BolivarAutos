<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Unsubscribe · BolivarAutos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f1f4f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;max-width:520px;width:100%;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 10px 30px rgba(15,23,42,.08);overflow:hidden}
  .head{background:#1E293B;color:#fff;padding:26px 24px;text-align:center}
  .head .brand{font-size:24px;font-weight:800;letter-spacing:.5px}
  .head .sub{font-size:14px;color:#cbd5e1;margin-top:4px}
  .body{padding:30px 26px 34px;text-align:center}
  .icon{font-size:52px;line-height:1}
  h1{font-size:24px;font-weight:800;color:#0f172a;margin:16px 0 8px}
  p{font-size:17px;color:#475569;line-height:1.6;margin:8px 0}
  .email{font-weight:700;color:#1E293B;word-break:break-all}
  .es{font-size:15px;color:#94a3b8;margin-top:6px}
  .btn{display:inline-block;background:#2563EB;color:#fff;border:none;padding:15px 26px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;margin-top:20px;min-height:56px;text-decoration:none}
  .btn:disabled{opacity:.55}
  .btn.ghost{background:#fff;color:#2563EB;border:2px solid #2563EB}
  .spinner{width:34px;height:34px;border:4px solid #dbeafe;border-top-color:#2563EB;border-radius:50%;animation:spin .8s linear infinite;margin:10px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .foot{font-size:13px;color:#94a3b8;margin-top:24px;line-height:1.5}
  .foot a{color:#2563EB;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="brand">BolivarAutos</div>
      <div class="sub">LIVARKAR Services Management Ltd. · Winnipeg, MB</div>
    </div>
    <div class="body" id="content">
      <div class="spinner"></div>
      <p>Loading… / Cargando…</p>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  var content = document.getElementById('content');

  function render(html){ content.innerHTML = html; }

  function getEmail(){
    var p = new URLSearchParams(location.search);
    var e = (p.get('e') || p.get('email') || '').trim().toLowerCase();
    return e;
  }

  function showError(msg){
    render(
      '<div class="icon">⚠️</div>' +
      '<h1>Something went wrong</h1>' +
      '<p>' + msg + '</p>' +
      '<p class="es">Ocurrió un problema. Escríbenos a ' +
      '<a href="mailto:info@bolivarautos.ca">info@bolivarautos.ca</a> ' +
      'y te damos de baja manualmente.</p>' +
      '<div class="foot">LIVARKAR Services Management Ltd.<br>Winnipeg, Manitoba, Canada · (204) 509-6153</div>'
    );
  }

  function showDone(email){
    render(
      '<div class="icon">✅</div>' +
      '<h1>You\'re unsubscribed</h1>' +
      '<p>We\'ve stopped sending new-car alerts to:</p>' +
      '<p class="email">' + email + '</p>' +
      '<p class="es">Listo. Ya no recibirás avisos de autos nuevos en este correo.</p>' +
      '<a class="btn ghost" href="https://bolivarautos.ca">Back to bolivarautos.ca</a>' +
      '<div class="foot">Changed your mind? You can re-subscribe anytime at bolivarautos.ca.<br>' +
      'LIVARKAR Services Management Ltd. · Winnipeg, MB · (204) 509-6153</div>'
    );
  }

  function doUnsubscribe(email){
    render('<div class="spinner"></div><p>Unsubscribing… / Procesando…</p>');
    var db = firebase.firestore();
    db.collection('SUSCRIPTORES').where('email','==',email).get().then(function(snap){
      if(snap.empty){
        // No lo encontramos: igual confirmamos (quizá ya estaba dado de baja o borrado).
        showDone(email);
        return;
      }
      var batch = db.batch();
      snap.forEach(function(doc){ batch.update(doc.ref, { activo:false, bajaFecha: new Date().toISOString() }); });
      return batch.commit().then(function(){ showDone(email); });
    }).catch(function(err){
      showError(err.message);
    });
  }

  function confirmScreen(email){
    render(
      '<div class="icon">🔕</div>' +
      '<h1>Unsubscribe from new-car alerts?</h1>' +
      '<p>You won\'t get emails when a new car is added, for:</p>' +
      '<p class="email">' + email + '</p>' +
      '<p class="es">Confirma para dejar de recibir avisos de autos nuevos.</p>' +
      '<button class="btn" id="btnGo">Yes, unsubscribe me</button>' +
      '<div class="foot">LIVARKAR Services Management Ltd. · Winnipeg, MB · (204) 509-6153</div>'
    );
    document.getElementById('btnGo').addEventListener('click', function(){ doUnsubscribe(email); });
  }

  try {
    firebase.initializeApp({
      apiKey:'AIzaSyBuRACKx_I-WLsCmmquAH9eWwkubwsdmUQ',
      authDomain:'bolivarautos-919e4.firebaseapp.com',
      projectId:'bolivarautos-919e4',
      storageBucket:'bolivarautos-919e4.firebasestorage.app',
      messagingSenderId:'397354528937',
      appId:'1:397354528397:web:52fd2ec53984af7aaa7cc4'
    });
  } catch(e){ /* ya inicializado */ }

  var email = getEmail();
  if(!email || email.indexOf('@') < 1){
    render(
      '<div class="icon">🔕</div>' +
      '<h1>Unsubscribe</h1>' +
      '<p>We couldn\'t read your email from the link.</p>' +
      '<p class="es">No pudimos leer tu correo desde el enlace. Escríbenos a ' +
      '<a href="mailto:info@bolivarautos.ca">info@bolivarautos.ca</a> y te damos de baja.</p>' +
      '<div class="foot">LIVARKAR Services Management Ltd. · Winnipeg, MB · (204) 509-6153</div>'
    );
  } else {
    confirmScreen(email);
  }
})();
</script>
</body>
</html>
